<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
@font-face{font-family:'Stranger';src:url('/fonts/Stranger-back-in-the-Night.ttf') format('truetype');font-weight:normal;font-style:normal;font-display:swap}
@font-face{font-family:'Designer';src:url('/fonts/Designer.ttf') format('truetype');font-weight:normal;font-style:normal;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;font-family:'Segoe UI',sans-serif;overflow:hidden}
#root{width:100%;height:100vh;display:flex;align-items:center;justify-content:center}
.pill{display:none;align-items:center;gap:0;padding:8px 0;background:rgba(10,10,10,0.92);border-radius:30px;min-width:260px;overflow:hidden;position:relative;animation:fadeIn .3s ease-out}
.pill.show{display:flex}
@keyframes fadeIn{0%{opacity:0;transform:scale(.85) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes pulseStar{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes shimmer{0%{transform:translateX(-100%) skewX(-15deg)}100%{transform:translateX(400%) skewX(-15deg)}}
.shimmer-wrap{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;border-radius:30px;pointer-events:none}
.shimmer-bar{position:absolute;top:0;left:-100%;width:40%;height:100%;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.03) 30%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.03) 70%,transparent 100%);animation:shimmer 3s ease-in-out infinite;pointer-events:none}
.left{display:flex;align-items:center;gap:6px;flex:1;margin-left:14px;margin-top:8px;position:relative;z-index:1}
.right{display:flex;flex-direction:column;align-items:center;gap:2px;padding-right:20px;position:relative;z-index:1}
.thank-text{font-family:'Stranger',cursive;font-size:28px;font-weight:700;color:#fff;letter-spacing:2px;text-transform:uppercase;white-space:nowrap;line-height:1}
.top3-text{font-family:'Designer',sans-serif;font-size:14px;font-weight:600;white-space:nowrap;letter-spacing:1px;line-height:1}
.ranker{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px}
.ranker-avatar{border-radius:50%;overflow:hidden}
.ranker-avatar img{width:100%;height:100%;object-fit:cover}
.crown{position:absolute;top:-10px;left:50%;transform:translateX(-50%);z-index:2}
.star{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:2;animation:pulseStar 1.5s ease-in-out infinite}
.ranker-name{font-size:8px;font-weight:700;color:#fff;max-width:50px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ranker-score{font-size:10px;font-weight:600}
</style>
</head>
<body>
<div id="root">
<div class="pill" id="pill">
<div class="shimmer-wrap"><div class="shimmer-bar"></div></div>
<div class="left" id="left">
<div style="display:flex;align-items:center;gap:6px" id="rankers">
</div>
</div>
<div class="right">
<div class="thank-text" id="thankText">Thank you</div>
<div class="top3-text" id="top3Text">Top 3 this stream</div>
</div>
</div>
</div>
<script>
(function(){
var params=new URLSearchParams(window.location.search);
var color=params.get('color')||'#f59e0b';
var duration=parseInt(params.get('duration')||'10')*1000;
document.getElementById('pill').style.border='1px solid '+color+'30';
document.getElementById('pill').style.boxShadow='0 0 40px '+color+'20';
document.getElementById('thankText').style.textShadow='0 0 12px '+color+'60';
document.getElementById('top3Text').style.color=color+'cc';
var pill=document.getElementById('pill');
var rankersEl=document.getElementById('rankers');
var hideTimer=null;
function show(data){
rankersEl.innerHTML='';
var order=[1,0,2];
order.forEach(function(idx){
var r=data[idx];
if(!r)return;
var isFirst=idx===0;
var d=document.createElement('div');
d.className='ranker';
var size=isFirst?'28px':'24px';
d.innerHTML=
(isFirst?'<div class="crown" id="crown-'+idx+'"></div>':'<div class="star" id="star-'+idx+'"></div>')+
'<div class="ranker-avatar" id="av-'+idx+'" style="width:'+size+';height:'+size+';background:linear-gradient(135deg,'+color+(isFirst?'30':'15')+','+color+'08);border:1.5px solid '+color+(isFirst?'70':'40')+'"><img src="'+(r.avatar||'')+'" onerror="this.remove()"/></div>'+
'<div class="ranker-name">'+r.name+'</div>'+
'<div class="ranker-score" id="score-'+idx+'" style="color:'+color+'cc">+'+r.score+'</div>';
rankersEl.appendChild(d);
var crownEl=document.getElementById('crown-'+idx);
var starEl=document.getElementById('star-'+idx);
if(isFirst&&crownEl){crownEl.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="'+color+'" style="filter:drop-shadow(0 0 4px '+color+'80)"><path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7z M3 20h18v2H3z"/></svg>';}
if(!isFirst&&starEl){starEl.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="'+color+'" style="filter:drop-shadow(0 0 4px '+color+'80)"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';}
});
pill.classList.add('show');
if(hideTimer)clearTimeout(hideTimer);
hideTimer=setTimeout(function(){pill.classList.remove('show');},duration);
}
  var username = params.get('user') || (function(){ try { return localStorage.getItem('username') || ''; } catch(e){ return ''; } })();
  if (!username) return;
  var clean = username.replace("@", "").trim();

  var userScores = {};
  function updateRankerScore(uid, name, avatar, points) {
    if (!uid) return;
    if (!userScores[uid]) {
      userScores[uid] = { name: name || uid, score: 0, avatar: avatar || "" };
    }
    userScores[uid].score += (points || 1);
    if (avatar && !userScores[uid].avatar) userScores[uid].avatar = avatar;

    var sorted = Object.values(userScores).sort(function(a,b){ return b.score - a.score; }).slice(0,3);
    if (sorted.length > 0) show(sorted);
  }

  // Initial show with demo data until live events accumulate
  show([{name:"أحمد",score:150,avatar:""},{name:"سارة",score:120,avatar:""},{name:"عمر",score:90,avatar:""}]);

  setInterval(function(){
    fetch("/api/widgets/state?widget=top-rankers&_t="+Date.now())
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.demo){
        show([{name:"أحمد",score:150,avatar:""},{name:"سارة",score:120,avatar:""},{name:"عمر",score:90,avatar:""}]);
        fetch("/api/widgets/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({widget:"top-rankers",demo:false})});
      }
    }).catch(function(){});
  },1000);

  var retryCount=0;var evtSource=null;
  function connect(){
    try{
      if (evtSource) evtSource.close();
      evtSource=new EventSource(window.location.origin+"/api/tiktok/live-events?user="+clean);
      evtSource.onopen=function(){retryCount=0;};
      evtSource.onmessage=function(ev){
        try{
          var data=JSON.parse(ev.data);
          if(data.connected)return;
          if (data.type === "top-rankers" && data.rankers) {
            show(data.rankers);
          } else if (data.type === "follower" || data.type === "like" || data.type === "chat" || data.type === "gift") {
            var uid = data.uniqueId || data.displayName;
            var pts = data.type === "gift" ? (data.giftCount || 1) : 1;
            updateRankerScore(uid, data.displayName, data.avatar, pts);
          }
        }catch(e){}
      };
      evtSource.onerror=function(){
        if (evtSource) evtSource.close();
        var delay=Math.min(1000*Math.pow(2,retryCount),15000);
        retryCount++;
        setTimeout(connect,delay);
      };
    }catch(e){setTimeout(connect,3000);}
  }
  connect();
})();
</script>
</body>
</html>
