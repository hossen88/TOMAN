<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: transparent; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
.pill {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px; background: rgba(10,10,10,0.92);
  border-radius: 30px; border: 1px solid #06b6d430;
  box-shadow: 0 0 40px #06b6d420; min-width: 260px;
  position: relative; overflow: hidden;
}
.icon { width: 36px; height: 36px; border-radius: 50%; background: #06b6d420; border: 1.5px solid #06b6d450; display: flex; align-items: center; justify-content: center; }
.icon svg { width: 18px; height: 18px; }
.text { margin-left: 10px; }
.label { font-size: 10px; color: #06b6d4cc; font-weight: 600; }
.name { font-size: 18px; font-weight: 900; color: #fff; text-shadow: 0 0 10px #06b6d430; }
.thanks { margin-left: auto; font-family: 'Segoe UI', cursive; font-size: 28px; font-weight: 700; color: #fff; padding-left: 10px; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 12px #06b6d460; white-space: nowrap; }
@keyframes fade { 0% { opacity:0; transform:scale(0.85) translateY(10px); } 100% { opacity:1; transform:scale(1) translateY(0); } }
@keyframes ring { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
@keyframes shimmer { 0% { transform:translateX(-100%) skewX(-15deg); } 100% { transform:translateX(400%) skewX(-15deg); } }
.pill { animation: fade 0.3s ease-out; }
.ring { animation: ring 3s linear infinite; }
.shimmer-bar {
  position: absolute; top: 0; left: -100%; width: 40%; height: 100%;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.03) 30%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 70%, transparent 100%);
  animation: shimmer 3s ease-in-out infinite; pointer-events: none;
}
</style>
</head>
<body>
<div class="pill" id="widget">
  <div class="shimmer-bar"></div>
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <line x1="19" y1="8" x2="19" y2="14"/>
      <line x1="22" y1="11" x2="16" y2="11"/>
    </svg>
  </div>
  <div class="text">
    <div class="label">New Follower!</div>
    <div class="name" id="name">_00dv</div>
  </div>
  <div class="thanks">Thank you</div>
</div>
<script>
var names = ["أحمد","سارة","عمر","ليلى","يوسف","نور","محمد","خالد"];
var i = 0;
function changeName() {
  document.getElementById("name").textContent = names[i % names.length];
  var el = document.getElementById("widget");
  el.style.animation = "none";
  el.offsetHeight;
  el.style.animation = "fade 0.3s ease-out";
  i++;
}
setInterval(changeName, 5000);
</script>
</body>
</html>
